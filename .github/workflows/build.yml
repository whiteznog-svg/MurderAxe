```yaml
name: Build MurderAxe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        run: mvn -B package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: MurderAxe
          path: target/MurderAxe-1.0.0.jar
